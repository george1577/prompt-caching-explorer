[project]
name = "prompt-caching-explorer"
version = "0.1.0"
description = "Interactive Streamlit app for learning how prompt caching saves time and money"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.40",
    "torch>=2.5",
    "transformers>=4.46",
    "sentence-transformers>=3.0",
    "pandas>=2.2",
    "anthropic>=0.60",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: loads a real local model"]
